spring.application.name=order-service
server.port=${PORT:8081}
spring.mvc.problemdetails.enabled=true
product-service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8080}
payment-service.base-url=${PAYMENT_SERVICE_URL:http://localhost:8082}
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reacspi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reacspi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reacspi}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=order_service
spring.flyway.default-schema=order_service
spring.flyway.schemas=order_service
