spring.application.name=payment-service
server.port=${PORT:8082}
payment.simulate-failure=${PAYMENT_SIMULATE_FAILURE:false}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reacspi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reacspi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reacspi}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=payment_service
spring.flyway.default-schema=payment_service
spring.flyway.schemas=payment_service
