services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reacspi
      POSTGRES_USER: reacspi
      POSTGRES_PASSWORD: reacspi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reacspi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reacspi -d reacspi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reacspi_postgres_data:
